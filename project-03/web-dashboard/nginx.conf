server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback (React Router / direktan pristup)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy ka Analytics servisu (REST + SSE) -> nema CORS-a.
  location /api/ {
    proxy_pass http://analytics:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    # SSE (/api/stream): bez baferovanja i sa dugim timeout-om.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
  }
}
